[package]
name = "gitsync"
version = "0.1.0"
edition = "2021"
description = "Keep a git repository, including uncommitted work, in sync across machines on a LAN"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rafhack/GitSync"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
gethostname = "1"
mdns-sd = "0.21"
notify = "8"
notify-debouncer-full = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
