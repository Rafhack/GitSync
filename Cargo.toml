[package]
name = "gitsync"
version = "0.3.0"
edition = "2021"
description = "Keep a git repository, including uncommitted work, in sync across machines on a LAN"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rafhack/GitSync"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
gethostname = "1"
hmac = "0.13.0"
mdns-sd = "0.21"
notify = "8"
notify-debouncer-full = "0.5"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.1"
spake2 = "0.4.0"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
