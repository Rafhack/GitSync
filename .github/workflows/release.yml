# Builds gitsync for each platform and publishes a GitHub release.
#
# A release happens in two cases:
#  1. A pull request is merged into main. The version comes from Cargo.toml.
#     If a tag for that version (v<version>) already exists, nothing happens,
#     so to release you bump the version in Cargo.toml in your PR.
#     The workflow creates the tag on the merge commit itself.
#  2. A version tag is pushed by hand:  git tag v0.1.0 && git push origin v0.1.0
#     The tag must match the version in Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  # Decides whether to release, which commit to build and which tag to use.
  prepare:
    # A closed pull request that was not merged is skipped.
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For a merged PR, build exactly the commit the merge put on main.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Read the version and check the tag
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          sha=$(git rev-parse HEAD)
          release=true
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "Tag $tag already exists, so there is nothing to release."
            echo "Bump the version in Cargo.toml to release this change."
            release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag sha=$sha release=$release"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static (musl) programs, so they run on any distribution.
          # rust-lld links them without a C toolchain for the target; clang
          # compiles ring's C code (TLS for the gitsync transport) for it.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, linker: rust-lld, cc: clang }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, linker: rust-lld, cc: clang }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.linker }}" ]; then
            var="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_LINKER"
            export "$var=${{ matrix.linker }}"
          fi
          if [ -n "${{ matrix.cc }}" ]; then
            export "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=${{ matrix.cc }}"
          fi
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Check it runs
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: target/${{ matrix.target }}/release/gitsync --version

      - name: Package
        shell: bash
        run: |
          name="gitsync-${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "../target/${{ matrix.target }}/release/gitsync.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            cp "../target/${{ matrix.target }}/release/gitsync" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # Takes this version's section of CHANGELOG.md (empty if there is none).
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          touch CHANGELOG.md
          awk -v h="## $TAG" '$0 == h {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        # The CHANGELOG section goes first, then GitHub's list of merged PRs.
        # --target creates the tag on that commit if it does not exist yet
        # (the merged-PR case); for a pushed tag it is already there.
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "gitsync $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
